<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Leitura · 1M</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#04090f; --surface:#0b1523; --border:#162033;
  --muted:#2a3f5c; --dim:#3d5a80; --text:#e8f1ff;
  --blue:#3a86ff; --green:#06d6a0; --purple:#c77dff;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { height:100%; }
body {
  height:100%; background:var(--bg); color:var(--text);
  font-family:'Nunito',sans-serif; overflow:hidden;
  touch-action:pan-y; -webkit-overflow-scrolling:touch;
}

.c0{background:#FF6B6B;color:#fff} .c1{background:#FF9F43;color:#fff}
.c2{background:#FFD60A;color:#1a1a1a} .c3{background:#06d6a0;color:#fff}
.c4{background:#3a86ff;color:#fff}   .c5{background:#c77dff;color:#fff}
.c6{background:#ff6b9d;color:#fff}   .c7{background:#00c9ff;color:#1a1a1a}
.glow-0{box-shadow:0 0 40px #FF6B6B99} .glow-1{box-shadow:0 0 40px #FF9F4399}
.glow-2{box-shadow:0 0 40px #FFD60A99} .glow-3{box-shadow:0 0 40px #06d6a099}
.glow-4{box-shadow:0 0 40px #3a86ff99} .glow-5{box-shadow:0 0 40px #c77dff99}
.glow-6{box-shadow:0 0 40px #ff6b9d99} .glow-7{box-shadow:0 0 40px #00c9ff99}

#app { height:100%; display:flex; flex-direction:column; }

.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:max(env(safe-area-inset-top), 14px) 18px 10px;
  flex-shrink:0;
}
.badge { font-size:0.65rem; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.counter {
  font-size:0.78rem; font-weight:900; color:#94a3b8;
  background:var(--surface); border:1px solid var(--border);
  border-radius:99px; padding:5px 16px;
}

.prog-wrap { height:2px; background:var(--border); margin:0 18px 8px; border-radius:99px; flex-shrink:0; }
.prog-fill  { height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width 0.4s cubic-bezier(.4,0,.2,1); border-radius:99px; }

.mode-tabs { display:flex; gap:5px; padding:0 18px 8px; flex-shrink:0; }
.tab-btn {
  flex:1; height:40px; border:1.5px solid var(--border); background:transparent; color:var(--dim);
  font-family:'Nunito',sans-serif; font-weight:900; font-size:0.67rem;
  border-radius:12px; cursor:pointer; transition:all 0.18s; text-transform:uppercase; letter-spacing:0.2px;
  touch-action:manipulation;
}
.tab-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 2px 16px #3a86ff44; }

.filter-row {
  display:flex; align-items:center; gap:6px; padding:0 18px 8px;
  flex-shrink:0; overflow-x:auto; scrollbar-width:none;
}
.filter-row::-webkit-scrollbar { display:none; }
.filt-btn {
  white-space:nowrap; padding:7px 14px; border:1.5px solid var(--border); background:transparent;
  color:var(--dim); font-family:'Nunito',sans-serif; font-weight:900; font-size:0.7rem;
  border-radius:10px; cursor:pointer; flex-shrink:0; transition:all 0.15s; touch-action:manipulation;
}
.filt-btn.active { border-color:var(--blue); color:var(--blue); background:#0a1628; }
.filt-spacer { flex:1; min-width:4px; }
.case-btn {
  white-space:nowrap; padding:7px 14px; border:1.5px solid var(--border); background:transparent;
  color:var(--dim); font-family:'Nunito',sans-serif; font-weight:900; font-size:0.7rem;
  border-radius:10px; cursor:pointer; flex-shrink:0; transition:all 0.15s; touch-action:manipulation;
}
.case-btn.on { border-color:var(--purple); color:var(--purple); background:#0f0a1e; }

.content {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  padding:8px 20px 4px; overflow:hidden; position:relative; min-height:0;
}
.swipe-hint {
  position:absolute; top:50%; transform:translateY(-50%);
  pointer-events:none; opacity:0; transition:opacity 0.2s;
  font-size:2.8rem; color:var(--blue); font-weight:900;
}
.swipe-hint.left  { left:6px; }
.swipe-hint.right { right:6px; }
.swipe-hint.show  { opacity:0.55; }

/* PALAVRAS */
.word-wrap {
  display:flex; align-items:center; justify-content:center;
  gap:10px; flex-wrap:wrap; max-width:100%;
}
.syl {
  font-family:'Courier Prime',monospace; font-weight:700;
  font-size:clamp(3rem,17vw,5.5rem); border-radius:18px;
  padding:12px 22px; line-height:1;
  transition:transform 0.2s cubic-bezier(.4,0,.2,1), opacity 0.2s;
}
.syl.inactive { opacity:0.1; transform:scale(0.84); }
.syl.active   { opacity:1; transform:scale(1.12); z-index:2; }
.syl.done     { opacity:0.28; transform:scale(0.9); }

/* LETRAS — cartão único grande */
.letra-card {
  font-family:'Courier Prime',monospace; font-weight:700;
  font-size:clamp(5rem,28vw,10rem); border-radius:24px;
  padding:20px 40px; line-height:1; text-align:center;
  transition:transform 0.2s cubic-bezier(.4,0,.2,1), opacity 0.2s;
}
.letra-label {
  margin-top:18px; font-size:0.65rem; font-weight:900;
  color:var(--dim); text-transform:uppercase; letter-spacing:1.5px;
}

/* FRASES / TEXTOS */
.texto-label {
  font-size:0.65rem; font-weight:900; color:var(--dim);
  text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px; flex-shrink:0;
}
.text-box {
  width:100%; max-width:480px; background:var(--surface);
  border:1px solid var(--border); border-radius:16px;
  padding:14px 18px; margin-bottom:16px; line-height:2.1; text-align:center;
  font-size:clamp(1.05rem,4.5vw,1.3rem); font-weight:800;
  flex-shrink:0; max-height:36%; overflow-y:auto;
}
.tw-done { color:var(--muted); }
.tw-cur  { color:#fff; background:var(--blue); border-radius:6px; padding:2px 7px; margin:0 2px; }
.tw-next { color:var(--dim); }

.syl-reveal { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.sylr {
  font-family:'Courier Prime',monospace; font-weight:700;
  font-size:clamp(2rem,11vw,3.8rem); border-radius:16px;
  padding:10px 18px; line-height:1;
  transition:transform 0.2s cubic-bezier(.4,0,.2,1), opacity 0.2s;
}
.sylr.inactive { opacity:0.1; transform:scale(0.84); }
.sylr.active   { opacity:1; transform:scale(1.1); z-index:2; }
.sylr.done     { opacity:0.28; transform:scale(0.9); }

.hint-wrap { margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.hint-emoji { font-size:1.9rem; animation:bounce 1s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.hint-txt { font-size:0.6rem; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; animation:pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.9} }
.next-lbl { margin-top:16px; font-size:0.72rem; font-weight:900; color:var(--blue); text-transform:uppercase; letter-spacing:0.5px; animation:pulse 1.5s ease-in-out infinite; }

.controls {
  display:flex; align-items:center; gap:12px;
  padding:12px 18px;
  padding-bottom:max(env(safe-area-inset-bottom), 22px);
  flex-shrink:0; border-top:1px solid var(--border);
}
.btn {
  border:none; border-radius:14px; font-family:'Nunito',sans-serif; font-weight:900;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; transition:transform 0.1s;
}
.btn:active { transform:scale(0.88); }
.btn:disabled { opacity:0.18; pointer-events:none; }
.btn-nav   { width:56px; height:56px; background:var(--surface); color:var(--dim); font-size:1.3rem; flex-shrink:0; border:1px solid var(--border); }
.btn-sound { flex:1; height:56px; background:var(--blue); color:#fff; font-size:0.9rem; letter-spacing:0.3px; box-shadow:0 4px 0 #1e3a8a; }
.btn-sound:active { box-shadow:0 1px 0 #1e3a8a; transform:translateY(3px) scale(0.97); }
.btn-sound.playing { background:#059669; box-shadow:0 4px 0 #065f46; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="badge">Turma 1M · Prof. Rui</div>
    <div class="counter" id="counter">1/1</div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:1%"></div></div>

  <div class="mode-tabs">
    <button class="tab-btn active" data-m="palavras" onclick="setMode('palavras')">📝 Palavras</button>
    <button class="tab-btn" data-m="letras"  onclick="setMode('letras')">🔤 Letras</button>
    <button class="tab-btn" data-m="frases"  onclick="setMode('frases')">💬 Frases</button>
    <button class="tab-btn" data-m="textos"  onclick="setMode('textos')">📖 Textos</button>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filt-btn active" data-d="todos" onclick="setDomain(this,'todos')">Todos</button>
    <button class="filt-btn" data-d="bas"  onclick="setDomain(this,'bas')">Básico</button>
    <button class="filt-btn" data-d="r"    onclick="setDomain(this,'r')">R · RR</button>
    <button class="filt-btn" data-d="bg"   onclick="setDomain(this,'bg')">B · G</button>
    <button class="filt-btn" data-d="dip"  onclick="setDomain(this,'dip')">Ditongos</button>
    <button class="filt-btn" data-d="gu"   onclick="setDomain(this,'gu')">GUE · GUI</button>
    <div class="filt-spacer"></div>
    <button class="case-btn" id="caseBtn" onclick="toggleCase()">Aa</button>
  </div>

  <div class="content" id="content" onclick="onTap()">
    <div class="swipe-hint left"  id="shL">‹</div>
    <div class="swipe-hint right" id="shR">›</div>
  </div>

  <div class="controls">
    <button class="btn btn-nav" id="btnPrev" onclick="goPrev()">←</button>
    <button class="btn btn-sound" id="btnSound" onclick="doSpeak(event)">🔊 Ouvir</button>
    <button class="btn btn-nav" id="btnNext" onclick="goNext()">→</button>
  </div>
</div>

<script>
// ── PALAVRAS ──────────────────────────────────────────────
const PW = [
  // Básico
  {r:"pa-to",d:"bas"},{r:"va-ca",d:"bas"},{r:"ca-ma",d:"bas"},{r:"pi-pa",d:"bas"},
  {r:"pe-ra",d:"bas"},{r:"no-me",d:"bas"},{r:"ve-la",d:"bas"},{r:"co-po",d:"bas"},
  {r:"tu-do",d:"bas"},{r:"ne-to",d:"bas"},{r:"da-do",d:"bas"},{r:"mo-to",d:"bas"},
  {r:"re-de",d:"bas"},{r:"vi-da",d:"bas"},{r:"do-na",d:"bas"},{r:"te-la",d:"bas"},
  {r:"ca-ne-ta",d:"bas"},{r:"me-ni-na",d:"bas"},{r:"ca-va-lo",d:"bas"},
  {r:"to-ma-te",d:"bas"},{r:"pa-ne-la",d:"bas"},{r:"pi-lo-to",d:"bas"},
  {r:"ca-me-lo",d:"bas"},{r:"me-ni-no",d:"bas"},
  // R · RR (rr corrigido)
  {r:"ra-to",d:"r"},{r:"ri-o",d:"r"},{r:"ru-a",d:"r"},{r:"ro-da",d:"r"},
  {r:"re-mo",d:"r"},{r:"ri-ma",d:"r"},{r:"pa-ra",d:"r"},{r:"cu-ra",d:"r"},
  {r:"ca-ra",d:"r"},{r:"mo-ra",d:"r"},{r:"to-ra",d:"r"},{r:"mo-ra-da",d:"r"},
  {r:"ca-rro",d:"r"},{r:"to-rre",d:"r"},{r:"be-rro",d:"r"},{r:"ba-rro",d:"r"},
  {r:"to-rra-da",d:"r"},{r:"mar-me-la-da",d:"r"},
  // B · G
  {r:"bo-la",d:"bg"},{r:"bo-ca",d:"bg"},{r:"bo-lo",d:"bg"},{r:"bi-co",d:"bg"},
  {r:"lo-bo",d:"bg"},{r:"tu-bo",d:"bg"},{r:"ca-bo",d:"bg"},{r:"bo-ta",d:"bg"},
  {r:"ba-la",d:"bg"},{r:"bo-né",d:"bg"},{r:"bi-be",d:"bg"},
  {r:"ga-to",d:"bg"},{r:"go-la",d:"bg"},{r:"la-go",d:"bg"},{r:"bo-ga",d:"bg"},
  {r:"ga-lo",d:"bg"},{r:"ga-ta",d:"bg"},{r:"lo-go",d:"bg"},
  // Ditongos
  {r:"pão",d:"dip"},{r:"cão",d:"dip"},{r:"mão",d:"dip"},{r:"não",d:"dip"},
  {r:"mãe",d:"dip"},{r:"lei",d:"dip"},{r:"rei",d:"dip"},{r:"meu",d:"dip"},
  {r:"viu",d:"dip"},{r:"riu",d:"dip"},{r:"pai",d:"dip"},{r:"vai",d:"dip"},
  {r:"ca-iu",d:"dip"},{r:"lei-te",d:"dip"},{r:"tou-ro",d:"dip"},
  {r:"noi-te",d:"dip"},{r:"cau-da",d:"dip"},{r:"rou-pa",d:"dip"},
  // GUE · GUI
  {r:"man-gue",d:"gu"},{r:"gue-to",d:"gu"},
  {r:"Gui-da",d:"gu"},{r:"gui-a-dor",d:"gu"},{r:"gui-a",d:"gu"},
  {r:"gui-ta",d:"gu"},{r:"gui-tar-ra",d:"gu"},
];

// ── LETRAS + SILABÁRIO ────────────────────────────────────
// Cada item: { r: texto a mostrar, label: legenda opcional }
// Letras individuais primeiro, depois sílabas por consoante
const LT = [
  // Letras
  {r:"a",label:"vogal"},{r:"e",label:"vogal"},{r:"i",label:"vogal"},
  {r:"o",label:"vogal"},{r:"u",label:"vogal"},
  {r:"m",label:"consoante"},{r:"p",label:"consoante"},{r:"t",label:"consoante"},
  {r:"v",label:"consoante"},{r:"d",label:"consoante"},{r:"n",label:"consoante"},
  {r:"c",label:"consoante"},{r:"l",label:"consoante"},{r:"r",label:"consoante"},
  {r:"rr",label:"dígrafo"},{r:"b",label:"consoante"},{r:"g",label:"consoante"},
  {r:"qu",label:"dígrafo"},{r:"gu",label:"dígrafo"},
  // Silabário — m
  {r:"ma",label:"m"},{r:"me",label:"m"},{r:"mi",label:"m"},{r:"mo",label:"m"},{r:"mu",label:"m"},
  // p
  {r:"pa",label:"p"},{r:"pe",label:"p"},{r:"pi",label:"p"},{r:"po",label:"p"},{r:"pu",label:"p"},
  // t
  {r:"ta",label:"t"},{r:"te",label:"t"},{r:"ti",label:"t"},{r:"to",label:"t"},{r:"tu",label:"t"},
  // v
  {r:"va",label:"v"},{r:"ve",label:"v"},{r:"vi",label:"v"},{r:"vo",label:"v"},{r:"vu",label:"v"},
  // d
  {r:"da",label:"d"},{r:"de",label:"d"},{r:"di",label:"d"},{r:"do",label:"d"},{r:"du",label:"d"},
  // n
  {r:"na",label:"n"},{r:"ne",label:"n"},{r:"ni",label:"n"},{r:"no",label:"n"},{r:"nu",label:"n"},
  // c/qu
  {r:"ca",label:"c"},{r:"co",label:"c"},{r:"cu",label:"c"},
  {r:"que",label:"qu"},{r:"qui",label:"qu"},
  // l
  {r:"la",label:"l"},{r:"le",label:"l"},{r:"li",label:"l"},{r:"lo",label:"l"},{r:"lu",label:"l"},
  // r (início)
  {r:"ra",label:"r"},{r:"re",label:"r"},{r:"ri",label:"r"},{r:"ro",label:"r"},{r:"ru",label:"r"},
  // rr (meio)
  {r:"rra",label:"rr"},{r:"rre",label:"rr"},{r:"rri",label:"rr"},{r:"rro",label:"rr"},{r:"rru",label:"rr"},
  // b
  {r:"ba",label:"b"},{r:"be",label:"b"},{r:"bi",label:"b"},{r:"bo",label:"b"},{r:"bu",label:"b"},
  // g/gu
  {r:"ga",label:"g"},{r:"go",label:"g"},{r:"gu",label:"g"},
  {r:"gue",label:"gu"},{r:"gui",label:"gu"},
];

// ── FRASES ────────────────────────────────────────────────
const W = (t, s) => ({ t, s: s || [t.replace(/[.,!?:;]/g,'')] });

const FR = [
  { t:"A Rita toca violino.", w:[
    W("A"),W("Rita",["Ri","ta"]),W("toca",["to","ca"]),W("violino.",["vi","o","li","no"])
  ]},
  { t:"O Rui tem um gato.", w:[
    W("O"),W("Rui",["Ru","i"]),W("tem"),W("um"),W("gato.",["ga","to"])
  ]},
  { t:"A Nora tem uma bola.", w:[
    W("A"),W("Nora",["No","ra"]),W("tem"),W("uma",["u","ma"]),W("bola.",["bo","la"])
  ]},
  { t:"O cão da Nora late.", w:[
    W("O"),W("cão"),W("da"),W("Nora",["No","ra"]),W("late.",["la","te"])
  ]},
  { t:"O Tomé tem um boné.", w:[
    W("O"),W("Tomé",["To","mé"]),W("tem"),W("um"),W("boné.",["bo","né"])
  ]},
  { t:"O Renato comeu uma torrada.", w:[
    W("O"),W("Renato",["Re","na","to"]),W("comeu",["co","meu"]),
    W("uma",["u","ma"]),W("torrada.",["to","rra","da"])
  ]},
  { t:"A Lídia vai ao lago com a mãe.", w:[
    W("A"),W("Lídia",["Lí","di","a"]),W("vai"),W("ao"),
    W("lago",["la","go"]),W("com"),W("a"),W("mãe.")
  ]},
  { t:"A Cátia viu uma gaivota no mar.", w:[
    W("A"),W("Cátia",["Cá","ti","a"]),W("viu"),W("uma",["u","ma"]),
    W("gaivota",["gai","vo","ta"]),W("no"),W("mar.")
  ]},
  { t:"O Marco tem um cubo e uma bola.", w:[
    W("O"),W("Marco",["Mar","co"]),W("tem"),W("um"),
    W("cubo",["cu","bo"]),W("e"),W("uma",["u","ma"]),W("bola.",["bo","la"])
  ]},
  { t:"O gato correu para o lago.", w:[
    W("O"),W("gato",["ga","to"]),W("correu",["cor","reu"]),
    W("para",["pa","ra"]),W("o"),W("lago.",["la","go"])
  ]},
  { t:"O Renato vai de carro para a rua.", w:[
    W("O"),W("Renato",["Re","na","to"]),W("vai"),W("de"),
    W("carro",["ca","rro"]),W("para",["pa","ra"]),W("a"),W("rua.",["ru","a"])
  ]},
  { t:"O cão late e corre pelo lago.", w:[
    W("O"),W("cão"),W("late",["la","te"]),W("e"),
    W("corre",["cor","re"]),W("pelo"),W("lago.",["la","go"])
  ]},
];

// ── TEXTOS ────────────────────────────────────────────────
const TX = [
  { titulo:"O Gato", words:[
    W("O"),W("Rui",["Ru","i"]),W("tem"),W("um"),W("gato."),
    W("O"),W("gato"),W("é"),W("gordo"),W("e"),W("bonito.",["bo","ni","to"]),
    W("O"),W("gato"),W("come"),W("e"),W("dorme.",["dor","me"]),
    W("O"),W("Rui",["Ru","i"]),W("adora",["a","do","ra"]),W("o"),W("gato.",["ga","to"]),
  ]},
  { titulo:"No Parque", words:[
    W("De"),W("tarde,"),W("a"),W("Marta",["Mar","ta"]),W("e"),W("o"),
    W("cão"),W("vão"),W("ao"),W("parque.",["par","que"]),
    W("O"),W("cão"),W("corre",["cor","re"]),W("e"),W("late.",["la","te"]),
    W("A"),W("Marta",["Mar","ta"]),W("ri"),W("muito.",["mui","to"]),
    W("O"),W("cão"),W("vem"),W("para",["pa","ra"]),W("a"),W("Marta.",["Mar","ta"]),
  ]},
  { titulo:"O Boné do Tomé", words:[
    W("O"),W("Tomé",["To","mé"]),W("tem"),W("um"),W("boné.",["bo","né"]),
    W("O"),W("boné"),W("é"),W("bonito.",["bo","ni","to"]),
    W("O"),W("Tomé",["To","mé"]),W("adora",["a","do","ra"]),W("o"),W("boné.",["bo","né"]),
    W("A"),W("mãe"),W("deu"),W("o"),W("boné",["bo","né"]),W("ao"),W("Tomé.",["To","mé"]),
  ]},
  { titulo:"O Carro do Renato", words:[
    W("O"),W("Renato",["Re","na","to"]),W("tem"),W("um"),W("carro.",["ca","rro"]),
    W("O"),W("carro"),W("é"),W("grande"),W("e"),W("bonito.",["bo","ni","to"]),
    W("O"),W("Renato",["Re","na","to"]),W("vai"),W("de"),W("carro",["ca","rro"]),
    W("para",["pa","ra"]),W("a"),W("cidade.",["ci","da","de"]),
    W("O"),W("cão"),W("vai"),W("no"),W("carro.",["ca","rro"]),
  ]},
];

// ── ESTADO ────────────────────────────────────────────────
let mode='palavras', domain='todos', caseUp=false;
let pList=[], pIdx=0, pSyl=-1, pCols=[];
let lIdx=0;
let fIdx=0, fWi=0, fSi=-1;
let tIdx=0, tWi=0, tSi=-1;

// ── CORES ─────────────────────────────────────────────────
const LETRA_COLS = [4,3,0,5,1,6,2,7];
function mkCols(n){
  const c=[]; let last=-1;
  for(let i=0;i<n;i++){
    const opts=[0,1,2,3,4,5,6,7].filter(j=>j!==last);
    const p=opts[Math.floor(Math.random()*opts.length)];
    c.push(p); last=p;
  } return c;
}
const _wc={};
function wCols(wi,n){
  const key=wi+'_'+n;
  if(!_wc[key]){
    const c=[]; let last=wi%8;
    for(let i=0;i<n;i++){
      const opts=[0,1,2,3,4,5,6,7].filter(j=>j!==last);
      last=opts[(wi*7+i*3)%opts.length]; c.push(last);
    } _wc[key]=c;
  } return _wc[key];
}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];
  } return b;
}
function buildP(){
  pList=domain==='todos'?shuffle([...PW]):shuffle(PW.filter(p=>p.d===domain));
  pIdx=0; pSyl=-1;
  pCols=pList.map(p=>mkCols(p.r.split('-').length));
}

// ── MODO / DOMÍNIO / CASO ─────────────────────────────────
function setMode(m){
  mode=m;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===m));
  const showFilter = m==='palavras';
  document.getElementById('filterRow').style.display=showFilter?'flex':'none';
  if(m==='palavras') buildP();
  if(m==='letras') lIdx=0;
  render();
}
function setDomain(el,d){
  domain=d;
  document.querySelectorAll('.filt-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); buildP(); render();
}
function toggleCase(){
  caseUp=!caseUp;
  const b=document.getElementById('caseBtn');
  b.textContent=caseUp?'AA':'Aa'; b.classList.toggle('on',caseUp); render();
}

// ── TOQUE ─────────────────────────────────────────────────
function onTap(){
  if(mode==='palavras'){
    if(!pList.length) return;
    const n=pList[pIdx].r.split('-').length;
    if(pSyl<n-1){pSyl++;}
    else if(pIdx<pList.length-1){pIdx++;pSyl=-1;}
  } else if(mode==='letras'){
    if(lIdx<LT.length-1) lIdx++;
  } else if(mode==='frases'){
    adv(FR[fIdx].w,fWi,fSi,(wi,si)=>{fWi=wi;fSi=si;},
      ()=>{if(fIdx<FR.length-1){fIdx++;fWi=0;fSi=-1;}});
  } else {
    adv(TX[tIdx].words,tWi,tSi,(wi,si)=>{tWi=wi;tSi=si;},
      ()=>{if(tIdx<TX.length-1){tIdx++;tWi=0;tSi=-1;}});
  }
  render();
}
function adv(words,wi,si,set,onEnd){
  const n=words[wi].s.length;
  if(si<n-1){set(wi,si+1);}
  else if(wi<words.length-1){set(wi+1,-1);}
  else{onEnd();}
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────
function goPrev(){
  if(mode==='palavras'){if(pIdx>0){pIdx--;pSyl=-1;}}
  else if(mode==='letras'){if(lIdx>0)lIdx--;}
  else if(mode==='frases'){if(fIdx>0)fIdx--;fWi=0;fSi=-1;}
  else{if(tIdx>0)tIdx--;tWi=0;tSi=-1;}
  render();
}
function goNext(){
  if(mode==='palavras'){if(pIdx<pList.length-1){pIdx++;pSyl=-1;}}
  else if(mode==='letras'){if(lIdx<LT.length-1)lIdx++;}
  else if(mode==='frases'){if(fIdx<FR.length-1)fIdx++;fWi=0;fSi=-1;}
  else{if(tIdx<TX.length-1)tIdx++;tWi=0;tSi=-1;}
  render();
}

// ── SWIPE ─────────────────────────────────────────────────
let tx0=null, ty0=null;
document.addEventListener('touchstart',e=>{
  if(!e.target.closest('#content')) return;
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx0===null) return;
  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(dx<0){goNext();flashSwipe('right');}
    else{goPrev();flashSwipe('left');}
  }
  tx0=null; ty0=null;
},{passive:true});
function flashSwipe(dir){
  const el=document.getElementById(dir==='left'?'shL':'shR');
  if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),260);}
}

// ── FALA ──────────────────────────────────────────────────
function doSpeak(e){
  if(e) e.stopPropagation();
  let txt='';
  if(mode==='palavras') txt=pList[pIdx]?.r.replace(/-/g,'');
  else if(mode==='letras') txt=LT[lIdx]?.r;
  else if(mode==='frases') txt=FR[fIdx]?.t;
  else txt=TX[tIdx]?.words.map(w=>w.t).join(' ');
  if(!txt||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const vs=window.speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang.includes('pt-PT'));
  if(v) u.voice=v;
  u.lang='pt-PT'; u.rate=0.65; u.pitch=1.05;
  const b=document.getElementById('btnSound');
  b.classList.add('playing'); b.textContent='🔊 A ler...';
  u.onend=()=>{b.classList.remove('playing');b.innerHTML='🔊 Ouvir';};
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();

// ── RENDER ────────────────────────────────────────────────
function render(){
  let n,total;
  if(mode==='palavras'){n=pIdx+1;total=pList.length;}
  else if(mode==='letras'){n=lIdx+1;total=LT.length;}
  else if(mode==='frases'){n=fIdx+1;total=FR.length;}
  else{n=tIdx+1;total=TX.length;}
  document.getElementById('counter').textContent=`${n} / ${total}`;
  document.getElementById('progFill').style.width=(n/total*100)+'%';

  const atS=mode==='palavras'?pIdx===0:mode==='letras'?lIdx===0:mode==='frases'?fIdx===0:tIdx===0;
  const atE=mode==='palavras'?pIdx===pList.length-1:mode==='letras'?lIdx===LT.length-1:mode==='frases'?fIdx===FR.length-1:tIdx===TX.length-1;
  document.getElementById('btnPrev').disabled=atS;
  document.getElementById('btnNext').disabled=atE;

  if(mode==='palavras') renderPalavras();
  else if(mode==='letras') renderLetra();
  else if(mode==='frases') renderFT(FR[fIdx].w,fWi,fSi,null);
  else renderFT(TX[tIdx].words,tWi,tSi,TX[tIdx].titulo);
}

function mkSyl(syl,state,ci,big){
  const cls=big?'syl':'sylr';
  const glow=state==='active'?`glow-${ci}`:'';
  const txt=caseUp?syl.toUpperCase():syl;
  return`<div class="${cls} ${state} c${ci} ${glow}">${txt}</div>`;
}

function renderPalavras(){
  const el=document.getElementById('content');
  if(!pList.length){
    el.innerHTML='<div class="swipe-hint left" id="shL">‹</div><div class="swipe-hint right" id="shR">›</div><div style="color:var(--muted)">Sem palavras.</div>';
    return;
  }
  const syls=pList[pIdx].r.split('-');
  const cols=pCols[pIdx]||mkCols(syls.length);
  let h='<div class="swipe-hint left" id="shL">‹</div><div class="swipe-hint right" id="shR">›</div>';
  h+='<div class="word-wrap">';
  syls.forEach((s,i)=>{
    const st=pSyl===-1?'inactive':i<pSyl?'done':i===pSyl?'active':'inactive';
    h+=mkSyl(s,st,cols[i],true);
  });
  h+='</div>';
  if(pSyl===-1){
    h+=`<div class="hint-wrap"><div class="hint-emoji">☝️</div><div class="hint-txt">toca para começar</div></div>`;
  } else if(pSyl===syls.length-1&&pIdx<pList.length-1){
    h+=`<div class="next-lbl">→ próxima palavra</div>`;
  }
  el.innerHTML=h;
}

function renderLetra(){
  const el=document.getElementById('content');
  const item=LT[lIdx];
  const ci=LETRA_COLS[lIdx % LETRA_COLS.length];
  const txt=caseUp?item.r.toUpperCase():item.r;
  let h='<div class="swipe-hint left" id="shL">‹</div><div class="swipe-hint right" id="shR">›</div>';
  h+=`<div class="letra-card c${ci} glow-${ci}">${txt}</div>`;
  if(item.label) h+=`<div class="letra-label">${item.label}</div>`;
  if(lIdx<LT.length-1){
    h+=`<div class="next-lbl" style="margin-top:24px">→ próximo</div>`;
  } else {
    h+=`<div class="next-lbl" style="color:var(--green);animation:none;margin-top:24px">✓ Muito bem!</div>`;
  }
  el.innerHTML=h;
}

function renderFT(words,wi,si,titulo){
  const el=document.getElementById('content');
  let h='<div class="swipe-hint left" id="shL">‹</div><div class="swipe-hint right" id="shR">›</div>';
  if(titulo) h+=`<div class="texto-label">📖 ${titulo}</div>`;
  h+='<div class="text-box">';
  words.forEach((word,i)=>{
    const cls=i<wi?'tw-done':i===wi?'tw-cur':'tw-next';
    h+=`<span class="${cls}">${word.t}</span> `;
  });
  h+='</div>';
  const syls=words[wi].s;
  const cols=wCols(wi,syls.length);
  h+='<div class="syl-reveal">';
  syls.forEach((s,i)=>{
    const st=si===-1?'inactive':i<si?'done':i===si?'active':'inactive';
    h+=mkSyl(s,st,cols[i],false);
  });
  h+='</div>';
  const isLastSyl=si===syls.length-1,isLastWord=wi===words.length-1;
  const isEndAll=mode==='frases'?fIdx===FR.length-1:tIdx===TX.length-1;
  if(si===-1){
    h+=`<div class="hint-wrap"><div class="hint-emoji">☝️</div><div class="hint-txt">toca para começar</div></div>`;
  } else if(!isLastSyl){
    h+=`<div class="hint-wrap"><div class="hint-emoji">☝️</div><div class="hint-txt">toca para avançar</div></div>`;
  } else if(!isLastWord){
    h+=`<div class="next-lbl">→ próxima palavra</div>`;
  } else if(isEndAll){
    h+=`<div class="next-lbl" style="color:var(--green);animation:none">✓ Muito bem!</div>`;
  } else {
    h+=`<div class="next-lbl">→ toca para continuar</div>`;
  }
  el.innerHTML=h;
}

// ── ARRANQUE ──────────────────────────────────────────────
buildP();
render();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();onTap();}
  if(e.key==='ArrowLeft'){e.preventDefault();goPrev();}
});
</script>
